name: Apply MRD audit hardening

on:
  push:
    paths:
      - '.github/workflows/mrd-audit-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply audit hardening fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/server.mjs',
              "  if (state.startsWith('online')) runtimeState.lastPowerIntent = null;\n",
              "  const recentSleepIntent = runtimeState.lastPowerIntent === 'asleep'\n"
              "    && Number.isFinite(Number(runtimeState.lastPowerIntentAt))\n"
              "    && now - Number(runtimeState.lastPowerIntentAt) < 15000;\n"
              "  if (state.startsWith('online') && !recentSleepIntent) {\n"
              "    runtimeState.lastPowerIntent = null;\n"
              "    runtimeState.lastPowerIntentAt = null;\n"
              "  }\n"
          )

          replace_once(
              'public/secret-client.js',
              "    $('commandBrowser')?.addEventListener('click', event => {\n"
              "      if (!state.active) return;\n"
              "      event.preventDefault(); event.stopImmediatePropagation();\n"
              "      void launchSecretApp('chrome', 'Browser');\n"
              "    }, true);\n\n",
              ""
          )

          replace_once(
              'public/secret-client.js',
              "      const name = card.querySelector('strong')?.textContent?.trim();\n"
              "      if (!name || name === 'MRD Admin') return;\n"
              "      event.preventDefault(); event.stopImmediatePropagation();\n"
              "      void launchSecretAppByName(name);\n",
              "      const id = card.dataset.appId || '';\n"
              "      const name = card.querySelector('strong')?.textContent?.trim();\n"
              "      if (!name || id === 'mrd-admin' || name === 'MRD Admin') return;\n"
              "      event.preventDefault(); event.stopImmediatePropagation();\n"
              "      if (id) void launchSecretApp(id, name);\n"
              "      else void launchSecretAppByName(name);\n"
          )

          replace_once(
              'public/app.js',
              "      button.className = 'app-card';\n      button.disabled = item.available === false;\n",
              "      button.className = 'app-card';\n      button.dataset.appId = item.id;\n      button.disabled = item.available === false;\n"
          )

          package = Path('package.json')
          text = package.read_text(encoding='utf-8')
          text = text.replace(' && node --check public/update-control.js', '')
          package.write_text(text, encoding='utf-8')

      - name: Remove obsolete updater client
        run: git rm public/update-control.js

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate hardened tree
        run: |
          npm ci
          npm run check

      - name: Commit hardened tree
        shell: bash
        run: |
          git config user.name "MRD Audit Bot"
          git config user.email "145463179+Clatlas@users.noreply.github.com"
          git rm .github/workflows/mrd-audit-hardening.yml
          git add src/server.mjs public/secret-client.js public/app.js package.json
          git commit -m "Harden MRD after audit"
          git push

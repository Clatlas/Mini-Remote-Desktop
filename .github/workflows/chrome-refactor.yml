$chrome = Find-Chrome
if ($chrome) { Add-Result 'Google Chrome' 'PASS' $chrome }
else { Add-Result 'Google Chrome' 'FAIL' 'Chrome executable was not found.' }

$chromeStatus = Try-Json "$BaseUrl/api/chrome/status"

name: Apply managed Chrome refactor

on:
  push:
    branches:
      - feature/chrome-window-browser
    paths:
      - .github/workflows/chrome-refactor.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chrome-window-browser

      - name: Normalize patch replacement handling
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/apply-chrome-refactor.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('pattern.sub(replacement, text, count=1)', 'pattern.sub(lambda _: replacement, text, count=1)')
          path.write_text(text, encoding='utf-8')

      - name: Apply refactor
        run: python scripts/apply-chrome-refactor.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate MRD
        run: npm run check

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "MRD Refactor Bot"
          git config user.email "145463179+Clatlas@users.noreply.github.com"
          git rm -f .github/workflows/chrome-refactor.yml scripts/apply-chrome-refactor.py
          git add -A
          git commit -m "Replace Browser Engine with managed Chrome window"
          git push origin HEAD:feature/chrome-window-browser

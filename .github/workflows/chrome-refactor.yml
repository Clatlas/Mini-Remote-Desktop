          switch_anchor = '''            'wheel' {\n                [MrdInput]::Move([int]$msg.x, [int]$msg.y)\n                [MrdInput]::Wheel([int]$msg.delta)\n            }'''
          switch_new = '''            'wheel' {\n                [MrdInput]::Move([int]$msg.x, [int]$msg.y)\n                [MrdInput]::Wheel([int]$msg.delta)\n            }\n            'relative-move' {\n                [MrdInput]::MoveRelative([int]$msg.dx, [int]$msg.dy)\n            }\n            'relative-wheel' {\n                [MrdInput]::Wheel([int]$msg.delta)\n            }\n            'button' {\n                [MrdInput]::Button([string]$msg.button, [bool]$msg.down)\n            }'''
          text = replace_once(text, switch_anchor, switch_new, 'secret worker relative cases')
          write(p, text)


services:
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - mrd-internal
      - mrd-edge

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD}
    volumes:
      - guac-db:/var/lib/postgresql/data
      - ./initdb.sql:/docker-entrypoint-initdb.d/001-guacamole.sql:ro
    networks: [mrd-internal]

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on: [guacd, postgres]
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole_user
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD}
      REMOTE_IP_VALVE_ENABLED: "true"
    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - mrd-internal
      - mrd-edge

volumes:
  guac-db:

networks:
  # Private backend network. PostgreSQL remains isolated from host/LAN access.
  mrd-internal:
    internal: true

  # Host-access bridge for the Guacamole frontend and guacd. Neither service
  # publishes guacd's port; this network only lets guacd reach
  # host.docker.internal:3389 and lets the Guacamole web UI bind localhost:8080.
  mrd-edge:
    driver: bridge

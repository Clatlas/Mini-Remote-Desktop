services:
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks: [mrd-internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD}
    volumes:
      - guac-db:/var/lib/postgresql/data
      - ./initdb.sql:/docker-entrypoint-initdb.d/001-guacamole.sql:ro
    networks: [mrd-internal]

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on: [guacd, postgres]
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole_user
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD}
      REMOTE_IP_VALVE_ENABLED: "true"
    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - mrd-internal
      - mrd-edge

volumes:
  guac-db:

networks:
  # Private backend network. PostgreSQL and guacd never receive host-facing ports.
  mrd-internal:
    internal: true

  # Frontend bridge used only by the Guacamole web container. The web port is
  # still bound explicitly to 127.0.0.1, so it is not exposed on LAN/WAN.
  # This bridge also allows Guacamole to reach host.docker.internal for RDP.
  mrd-edge:
    driver: bridge
